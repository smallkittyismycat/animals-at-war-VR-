  <style>
    body { margin: 0; overflow: hidden; background: #000000; font-family: monospace; color: #00ff41; user-select: none; }

      position: absolute; top: 12px; left: 12px; z-index: 10; pointer-events: none;

    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;

  <script type="module">

    function makeProceduralTexture(type) {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');

      if (type === 'stone') {
        ctx.fillStyle = '#4a4e54';
        ctx.fillRect(0, 0, 128, 128);
        for (let i = 0; i < 300; i++) {
          ctx.fillStyle = Math.random() > 0.5 ? '#5b6068' : '#383b40';
          ctx.fillRect(Math.random() * 128, Math.random() * 128, 4 + Math.random() * 6, 4 + Math.random() * 6);
        }
      } else if (type === 'metal') {
        ctx.fillStyle = '#3b4248';
        ctx.fillRect(0, 0, 128, 128);
        ctx.strokeStyle = '#525b63';
        ctx.lineWidth = 3;
        ctx.strokeRect(2, 2, 124, 124);
      } else if (type === 'wood') {
        ctx.fillStyle = '#5c3c24';
        ctx.fillRect(0, 0, 128, 128);
        ctx.fillStyle = '#472d1a';
        for (let y = 0; y < 128; y += 8) ctx.fillRect(0, y, 128, 3);
      } else if (type === 'moon') {
        ctx.fillStyle = '#757a82';
        ctx.fillRect(0, 0, 128, 128);
        for (let i = 0; i < 20; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * 128, Math.random() * 128, 4 + Math.random() * 10, 0, Math.PI * 2);
          ctx.fillStyle = '#5a5e66';
          ctx.fill();
        }
      } else {
        ctx.fillStyle = '#1e242b';
        ctx.fillRect(0, 0, 128, 128);
        ctx.strokeStyle = '#2f3945';
        ctx.lineWidth = 2;
        ctx.strokeRect(0, 0, 128, 128);
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 2);
      return tex;
    }

    const TEX = {
      stone: makeProceduralTexture('stone'),
      metal: makeProceduralTexture('metal'),
      wood: makeProceduralTexture('wood'),
      moon: makeProceduralTexture('moon'),
      floor: makeProceduralTexture('gridfloor')
    };

    const wireGreenMat = new THREE.MeshBasicMaterial({ color: 0x00ff41, wireframe: true });
    const wireBrightMat = new THREE.MeshBasicMaterial({ color: 0xbaffcc, wireframe: true });
    const wireDimMat = new THREE.MeshBasicMaterial({ color: 0x005515, wireframe: true });
    const wireGodlyMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
    const lineGreenMat = new THREE.LineBasicMaterial({ color: 0x00ff41 });

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      const bank = {
        revolver: ['sawtooth', 940, 52, 0.16, 0.20],
        shotgun: ['square', 220, 26, 0.30, 0.26],
        sniper: ['sawtooth', 1400, 40, 0.24, 0.24],
        crossbow: ['triangle', 430, 155, 0.12, 0.16],
        rpg: ['sawtooth', 175, 540, 0.36, 0.18],
        explosion: ['square', 105, 18, 0.48, 0.30],
        yeetblade: ['sine', 330, 1150, 0.14, 0.15],
        holster: ['triangle', 520, 320, 0.06, 0.13],
        pain: ['sawtooth', 165, 32, 0.35, 0.22],
        survive: ['sine', 440, 880, 0.22, 0.16],
        godly: ['sawtooth', 140, 900, 0.50, 0.24]
      };
      const [wave, f1, f2, dur, vol] = bank[type] || bank.holster;
      osc.type = wave;
      osc.frequency.setValueAtTime(f1, now);
      osc.frequency.exponentialRampToValueAtTime(f2, now + dur);
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + dur);
    }

    const SKIN_PALETTES = {
      GORILLA: { primary: 0x2b2d30, secondary: 0x45484d, eye: 0xffffff, nose: 0x1a1a1c, scale: 1.05 },
      CAT:     { primary: 0xd9822b, secondary: 0xf5cba7, eye: 0x33ff66, nose: 0xff8899, scale: 0.96 },

      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.78, 0.38), matPrimary);

      const belly = new THREE.Mesh(new THREE.BoxGeometry(0.40, 0.56, 0.06), matSecondary);

      root.add(torso, belly);

      const headGroup = new THREE.Group();
      headGroup.position.set(0, 1.62, 0);
      const headBox = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.44, 0.46), matPrimary);
      headGroup.add(headBox);

      const eyeGeo = new THREE.BoxGeometry(0.09, skinName === 'KITTEN' || skinName === 'PUG' ? 0.11 : 0.08, 0.04);
      const leftEye = new THREE.Mesh(eyeGeo, matEye);
      leftEye.position.set(-0.12, 0.05, 0.23);
      const rightEye = leftEye.clone();
      rightEye.position.x = 0.12;
      headGroup.add(leftEye, rightEye);

if (skinName === 'GORILLA') {
const brow = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.09, 0.10), matSecondary);
brow.position.set(0, 0.12, 0.23);
const muzzle = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.20, 0.14), matSecondary);
muzzle.position.set(0, -0.08, 0.25);
const earGeo = new THREE.BoxGeometry(0.08, 0.14, 0.10);
const earL = new THREE.Mesh(earGeo, matSecondary); earL.position.set(-0.26, 0.02, 0);
const earR = earL.clone(); earR.position.x = 0.26;
headGroup.add(brow, muzzle, earL, earR);
} else if (skinName === 'CAT' || skinName === 'KITTEN') {
const earGeo = new THREE.ConeGeometry(0.10, 0.22, 4);
const earL = new THREE.Mesh(earGeo, matPrimary); earL.position.set(-0.15, 0.30, 0);
const earR = earL.clone(); earR.position.x = 0.15;
const nose = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, 0.06), matNose);
nose.position.set(0, -0.04, 0.24);
const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.55, 6), matPrimary);
tail.position.set(0, 0.85, -0.32); tail.rotation.x = -0.7;
headGroup.add(earL, earR, nose);
root.add(tail);
} else if (skinName === 'K9') {
const earGeo = new THREE.ConeGeometry(0.09, 0.26, 4);
const earL = new THREE.Mesh(earGeo, matSecondary); earL.position.set(-0.15, 0.32, -0.02);
const earR = earL.clone(); earR.position.x = 0.15;
const snout = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.18, 0.24), matSecondary);
snout.position.set(0, -0.07, 0.30);
const nose = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.07, 0.06), matNose);
nose.position.set(0, -0.02, 0.42);
const tail = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.48, 6), matSecondary);
tail.position.set(0, 0.82, -0.30); tail.rotation.x = -0.85;
headGroup.add(earL, earR, snout, nose);
root.add(tail);
} else if (skinName === 'PUG') {
const earGeo = new THREE.BoxGeometry(0.12, 0.14, 0.10);
const earL = new THREE.Mesh(earGeo, matSecondary); earL.position.set(-0.22, 0.18, 0.06); earL.rotation.z = 0.4;
const earR = new THREE.Mesh(earGeo, matSecondary); earR.position.set(0.22, 0.18, 0.06); earR.rotation.z = -0.4;
const flatMuzzle = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.18, 0.10), matSecondary);
flatMuzzle.position.set(0, -0.08, 0.25);
const curlTail = new THREE.Mesh(new THREE.TorusGeometry(0.09, 0.035, 6, 10), matPrimary);
curlTail.position.set(0, 0.92, -0.24);
headGroup.add(earL, earR, flatMuzzle);
root.add(curlTail);
}
if (isGodly) {
const crown = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.04, 6, 12), wireGodlyMat);
crown.rotation.x = Math.PI / 2;
crown.position.y = 0.36;
headGroup.add(crown);
}
root.add(headGroup);
const armThick = skinName === 'GORILLA' ? 0.18 : 0.14;
const leftArm = new THREE.Mesh(new THREE.BoxGeometry(armThick, 0.62, armThick), matPrimary);
leftArm.position.set(-0.38, 1.02, 0);
const rightArm = leftArm.clone(); rightArm.position.x = 0.38;
const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.58, 0.20), matPrimary);
leftLeg.position.set(-0.16, 0.29, 0);
const rightLeg = leftLeg.clone(); rightLeg.position.x = 0.16;
root.add(leftArm, rightArm, leftLeg, rightLeg);
root.traverse((obj) => {
if (obj.isMesh) {
obj.userData.solidMat = obj.material;
obj.userData.wireMat = isGodly ? wireGodlyMat : wireGreenMat;
}
});
return { root, headGroup, leftArm, rightArm, leftLeg, rightLeg };
}
const WEAPON_TYPES = ['revolver', 'shotgun', 'sniper', 'crossbow', 'rpg', 'yeetblade'];
const scopeTarget = new THREE.WebGLRenderTarget(256, 256);

function build1to1WeaponMesh(type) {
const g = new THREE.Group();
const steelMat = new THREE.MeshStandardMaterial({ color: 0x7a828a, metalness: 0.7, roughness: 0.3 });
const darkSteelMat = new THREE.MeshStandardMaterial({ color: 0x2c3036, metalness: 0.8, roughness: 0.35 });

const hand = new THREE.Mesh(new THREE.BoxGeometry(0.085, 0.085, 0.10), darkSteelMat);
g.add(hand);
if (type === 'revolver') {
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.24, 8), steelMat);
barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.035, -0.19);
const cylinder = new THREE.Mesh(new THREE.CylinderGeometry(0.030, 0.030, 0.06, 6), darkSteelMat);
cylinder.rotation.x = Math.PI / 2; cylinder.position.set(0, 0.03, -0.06);
const grip = new THREE.Mesh(new THREE.BoxGeometry(0.036, 0.11, 0.048), woodMat);
grip.position.set(0, -0.045, 0.01); grip.rotation.x = 0.28;
g.add(barrel, cylinder, grip);
} else if (type === 'shotgun') {
const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.44, 8), darkSteelMat);
b1.rotation.x = Math.PI / 2; b1.position.set(-0.018, 0.03, -0.25);
const b2 = b1.clone(); b2.position.x = 0.018;
const pump = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.045, 0.16), woodMat);
pump.position.set(0, 0.012, -0.22);
const stock = new THREE.Mesh(new THREE.BoxGeometry(0.048, 0.08, 0.22), woodMat);
stock.position.set(0, -0.015, 0.06); stock.rotation.x = -0.15;
g.add(b1, b2, pump, stock);
} else if (type === 'sniper') {
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.016, 0.62, 8), darkSteelMat);
barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.035, -0.34);
const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.048, 0.065, 0.26), oliveMat);
receiver.position.set(0, 0.025, -0.06);
const scopeTube = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.24, 12), darkSteelMat);
scopeTube.rotation.x = Math.PI / 2; scopeTube.position.set(0, 0.086, -0.09);
const lensMat = new THREE.MeshBasicMaterial({ map: scopeTarget.texture });
const rearLens = new THREE.Mesh(new THREE.CircleGeometry(0.024, 12), lensMat);
rearLens.position.set(0, 0.086, 0.032);
const stock = new THREE.Mesh(new THREE.BoxGeometry(0.044, 0.09, 0.24), oliveMat);
stock.position.set(0, -0.01, 0.12);
g.add(barrel, receiver, scopeTube, rearLens, stock);
} else if (type === 'crossbow') {
const stock = new THREE.Mesh(new THREE.BoxGeometry(0.042, 0.045, 0.42), woodMat);
stock.position.set(0, 0.02, -0.16);
const limbs = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.02, 0.035), darkSteelMat);
limbs.position.set(0, 0.03, -0.34);
const bolt = new THREE.Mesh(new THREE.ConeGeometry(0.016, 0.28, 5), steelMat);
bolt.rotation.x = -Math.PI / 2; bolt.position.set(0, 0.048, -0.24);
g.add(stock, limbs, bolt);
} else if (type === 'rpg') {
const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.044, 0.044, 0.58, 10), oliveMat);
tube.rotation.x = Math.PI / 2; tube.position.set(0, 0.035, -0.18);
const warhead = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.16, 8), woodMat);
warhead.rotation.x = -Math.PI / 2; warhead.position.set(0, 0.035, -0.52);
g.add(tube, warhead);
} else if (type === 'yeetblade') {
const hilt = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.15, 8), darkSteelMat);
const blade = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.46, 0.055), neonBladeMat);
blade.position.set(0, 0.30, -0.05); blade.rotation.x = -0.32;
const hook = new THREE.Mesh(new THREE.ConeGeometry(0.032, 0.11, 6), steelMat);
hook.position.set(0, 0.52, -0.14); hook.rotation.x = -0.85;
g.add(hilt, blade, hook);
}
const laserGeo = new THREE.BufferGeometry().setFromPoints([
new THREE.Vector3(0, 0.03, -0.28),
new THREE.Vector3(0, 0.03, -18)
]);
g.add(new THREE.Line(laserGeo, lineGreenMat));
g.traverse((obj) => {
if (obj.isMesh) {
obj.userData.solidMat = obj.material;
obj.userData.wireMat = wireBrightMat;
}
});
return g;
}

function makeBiomeMaterial(biome, role = 'wall') {
if (role === 'lava') return new THREE.MeshStandardMaterial({ color: 0xff4400, emissive: 0xcc2200, roughness: 0.4 });
if (role === 'slime') return new THREE.MeshStandardMaterial({ color: 0x11cc44, emissive: 0x08551a, roughness: 0.3 });
if (biome === 'mines') return new THREE.MeshStandardMaterial({ map: TEX.stone, color: 0x8a6d5c, roughness: 0.85 });
if (biome === 'sewers') return new THREE.MeshStandardMaterial({ map: TEX.metal, color: 0x5c7566, roughness: 0.65 });
if (biome === 'forest') return new THREE.MeshStandardMaterial({ map: TEX.wood, color: 0x665548, roughness: 0.9 });
if (biome === 'space') return new THREE.MeshStandardMaterial({ map: TEX.moon, color: 0x9aa2b0, roughness: 0.8 });
return new THREE.MeshStandardMaterial({ map: TEX.floor, color: 0x778899, roughness: 0.7 });
}
function addWorldBox(w, h, d, x, y, z, solidMat, wireMatOverride = wireGreenMat, alwaysRender = false, noCollide = false) {
const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), solidMat);
mesh.position.set(x, y, z);
mesh.frustumCulled = false;
mesh.castShadow = true;
mesh.receiveShadow = true;
mesh.userData.solidMat = solidMat;
mesh.userData.wireMat = wireMatOverride;
worldGroup.add(mesh);
const min = new THREE.Vector3(x - w / 2, y - h / 2, z - d / 2);
const max = new THREE.Vector3(x + w / 2, y + h / 2, z + d / 2);
const box = new THREE.Box3(min, max);
const sphere = new THREE.Sphere();
box.getBoundingSphere(sphere);
physicsEntities.push({ box, mesh, sphere, alwaysRender, visualOnly: noCollide });
return mesh;
}
function makeTextPlane(text, w = 4.5, h = 1.1, bg = 'rgba(0,20,10,0.88)') {
const c = document.createElement('canvas');
c.width = 512; c.height = 128;
const ctx = c.getContext('2d');
ctx.fillStyle = bg; ctx.fillRect(0, 0, 512, 128);
ctx.strokeStyle = '#00ff41'; ctx.lineWidth = 6; ctx.strokeRect(4, 4, 504, 120);
ctx.fillStyle = '#00ff41'; ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center';
ctx.fillText(text, 256, 74);
const mat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, side: THREE.DoubleSide });
const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
mesh.userData.solidMat = mat;
mesh.userData.wireMat = mat;
return mesh;
}
function addInteractivePanel(label, x, y, z, rotY, actionFn) {
const panel = makeTextPlane(label, 3.2, 0.85);
panel.position.set(x, y, z);
panel.rotation.y = rotY;

for (let i = 0; i < physicsEntities.length; i++) {
const ent = physicsEntities[i];
if (ent.visualOnly) continue;
if (point.z + radius < ent.box.min.z || point.z - radius > ent.box.max.z) continue;
const closest = ent.box.clampPoint(point, new THREE.Vector3());
if (closest.distanceTo(point) <= radius) return closest;
}

}
